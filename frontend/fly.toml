# Fly.io: web app (Next.js standalone). The API URL is baked in at build time.
app = "latam-bank-disputes-web"
primary_region = "gru"

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = "https://latam-bank-disputes-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
