name: keep-warm
# The API runs on Render's free plan, which sleeps after 15 idle minutes and takes ~30 s to wake. During the judging
# window this pings the health endpoint every 10 minutes so judges never meet a cold start. Free plan hours cover one
# always-on service (750 h/month). Remove the schedule after the event.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API and the web app
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 https://latam-bank-dispute-ops-api.onrender.com/health && break
            sleep 10
          done
          curl -fsS --max-time 30 -o /dev/null https://latam-bank-disputes.vercel.app
