name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uvx ruff check --select F,E9 src tests
      - run: uv run pytest -q   # offline: live-LLM tests are skipped without RUN_LIVE_LLM
