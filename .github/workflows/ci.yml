name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uvx ruff check src tests   # rules in pyproject.toml
      - run: uv run pytest -q   # offline: live-LLM tests are skipped without RUN_LIVE_LLM
      - name: data pipeline on the labelled fixture (write-audit-publish must publish)
        run: uv run python -m dispute_ops.pipeline --raw tests/fixtures/raw_mini --out /tmp/pipeline-out --report /tmp/quality.md --demo-customers 5
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
