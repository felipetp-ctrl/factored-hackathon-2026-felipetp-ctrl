services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env          # ANTHROPIC_API_KEY, AGENT_API_KEY, SESSION_SECRET (never committed)
    environment:
      DB_PATH: /tmp/dispute_ops.db
      DEMO_NOW: "2026-06-17T12:00:00+00:00"
      DEMO_MODE: "true"
      # Uncomment after `make data` to serve the gold sample of the organizer dataset instead of the fixture:
      # DEMO_DB: /data/demo/dispute_ops.db
    # volumes:
    #   - ./data/demo:/data/demo:ro
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm start"
    volumes: ["./frontend:/app"]
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
