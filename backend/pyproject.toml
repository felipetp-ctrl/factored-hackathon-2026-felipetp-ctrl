[project]
name = "dispute-ops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
]
ml = [
    "mlflow>=3.16.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispute_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
