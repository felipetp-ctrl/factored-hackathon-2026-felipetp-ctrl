# Render blueprint: API as a Docker web service (free plan sleeps when idle; judges will be told when it is up).
services:
  - type: web
    name: latam-bank-dispute-ops-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEMO_NOW
        value: "2026-06-17T12:00:00+00:00"
      - key: DEMO_DB
        value: /app/demo_data/dispute_ops.db
      - key: FRAUD_ALERT_LOOKBACK_HOURS
        value: "720"
      # Public demo: per-visitor workspaces, bank-side views without a key (synthetic data only, ADR-016)
      - key: DEMO_MODE
        value: "true"
      # Claude first, free rule-based NLU when the model fails or the spend cap is reached (ADR-017)
      - key: NLU_MODE
        value: auto
      # Judging window (ADR-026): below the provider workspace limit of US$ 5
      - key: LLM_BUDGET_USD
        value: "4.5"
      - key: LLM_DAILY_BUDGET_USD
        value: "0.6"
      - key: LLM_WORKSPACE_BUDGET_USD
        value: "0.25"
