# Render blueprint: API as a Docker web service (free plan sleeps when idle; judges will be told when it is up).
services:
  - type: web
    name: latam-bank-dispute-ops-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEMO_NOW
        value: "2026-06-17T12:00:00+00:00"
